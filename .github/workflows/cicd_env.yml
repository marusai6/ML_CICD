name: ML application CI/CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # CI for application code.
  code-ci:
    name: CI / application code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Formatting check
        run: python scripts/check_formatting.py
      - name: Static analysis
        run: ruff check app scripts tests
      - name: Unit and preprocessing tests
        run: pytest -q tests/test_preprocessing.py

  # CI for ML components.
  ml-ci:
    name: CI / ML components
    runs-on: ubuntu-latest
    needs: code-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare deterministic demonstration data
        run: python scripts/create_demo_data.py --output data/demo.csv
      - name: Data contract checks
        run: python scripts/validate_data.py data/demo.csv
      - name: Train, evaluate, and enforce model quality gate
        run: python scripts/train_and_evaluate.py --data data/demo.csv --min-f1 0.75
      - name: Model loading test
        run: python -m scripts.check_model_loading
      - name: API contract tests
        run: pytest -q tests/test_api.py
      - name: Model quality regression test
        run: pytest -q tests/test_model_quality.py
      - name: Upload validated model bundle
        uses: actions/upload-artifact@v4
        with:
          name: validated-model-bundle
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  # Build once, scan that image, and pass the identical tar to publication.
  build-scan:
    name: CI / build and vulnerability scan
    runs-on: ubuntu-latest
    needs: ml-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: validated-model-bundle
          path: artifacts/
      - name: Build image with commit metadata
        run: |
          docker build \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "ml-app:${GITHUB_SHA}" .
      - name: Scan for critical and high vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ml-app:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          cache: 'false'
      - name: Export the scanned image
        run: docker save "ml-app:${GITHUB_SHA}" -o image.tar
      - name: Upload scanned image artifact
        uses: actions/upload-artifact@v4
        with:
          name: scanned-image-tar
          path: image.tar
          if-no-files-found: error
          retention-days: 3

  publish:
    name: CD / publish image to GHCR
    runs-on: ubuntu-latest
    needs: build-scan
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.push.outputs.image_ref }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: scanned-image-tar
          path: .
      - name: Load, uniquely tag, and publish the same image
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_NAME="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          docker load -i image.tar
          docker tag "ml-app:${GITHUB_SHA}" "$IMAGE_NAME:sha-${GITHUB_SHA}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE_NAME:sha-${GITHUB_SHA}"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_NAME:sha-${GITHUB_SHA}")"
          if [[ -z "$DIGEST" || "$DIGEST" != *@sha256:* ]]; then
            echo "Could not obtain immutable image digest" >&2
            exit 1
          fi
          echo "image_ref=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Published immutable image: $DIGEST"
          echo "Source commit: $GITHUB_SHA"

  deploy-test:
    name: CD / ephemeral staging and smoke tests
    runs-on: ubuntu-latest
    needs: publish

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io \
            -u "$GH_USER" \
            --password-stdin

      - name: Pull published immutable image
        env:
          IMAGE_REF: ${{ needs.publish.outputs.image_ref }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_REF"
          docker pull "$IMAGE_REF"

      - name: Start test container
        env:
          IMAGE_REF: ${{ needs.publish.outputs.image_ref }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker run -d \
            --name ml-api-test \
            -p 127.0.0.1:8000:8000 \
            -e MODEL_VERSION="sha-${COMMIT_SHA}" \
            "$IMAGE_REF"

      - name: Wait for readiness
        shell: bash
        run: |
          set -euo pipefail

          READY=0

          for i in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:8000/ready \
              > /dev/null; then
              READY=1
              break
            fi

            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "::error::Service did not become ready"
            exit 1
          fi

      - name: Run smoke tests
        env:
          BASE_URL: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          python scripts/smoke_test.py "$BASE_URL"

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs ml-api-test || true

      - name: Stop and remove test container
        if: always()
        run: |
          docker rm -f ml-api-test || true