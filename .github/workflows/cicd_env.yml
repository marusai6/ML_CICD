name: ML application CI/CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # CI for application code.
  code-ci:
    name: CI / application code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Formatting check
        run: python scripts/check_formatting.py
      - name: Static analysis
        run: ruff check app scripts tests
      - name: Unit and preprocessing tests
        run: pytest -q tests/test_preprocessing.py

  # CI for ML components.
  ml-ci:
    name: CI / ML components
    runs-on: ubuntu-latest
    needs: code-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare deterministic demonstration data
        run: python scripts/create_demo_data.py --output data/demo.csv
      - name: Data contract checks
        run: python scripts/validate_data.py data/demo.csv
      - name: Train, evaluate, and enforce model quality gate
        run: python scripts/train_and_evaluate.py --data data/demo.csv --min-f1 0.75
      - name: Model loading test
        run: python -m scripts.check_model_loading
      - name: API contract tests
        run: pytest -q tests/test_api.py
      - name: Model quality regression test
        run: pytest -q tests/test_model_quality.py
      - name: Upload validated model bundle
        uses: actions/upload-artifact@v4
        with:
          name: validated-model-bundle
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

  # Build once, scan that image, and pass the identical tar to publication.
  build-scan:
    name: CI / build and vulnerability scan
    runs-on: ubuntu-latest
    needs: ml-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: validated-model-bundle
          path: artifacts/
      - name: Build image with commit metadata
        run: |
          docker build \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "ml-app:${GITHUB_SHA}" .
      - name: Scan for critical and high vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ml-app:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
      - name: Export the scanned image
        run: docker save "ml-app:${GITHUB_SHA}" -o image.tar
      - name: Upload scanned image artifact
        uses: actions/upload-artifact@v4
        with:
          name: scanned-image-tar
          path: image.tar
          if-no-files-found: error
          retention-days: 3

  publish:
    name: CD / publish image to GHCR
    runs-on: ubuntu-latest
    needs: build-scan
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.push.outputs.image_ref }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: scanned-image-tar
          path: .
      - name: Load, uniquely tag, and publish the same image
        id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_NAME="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          docker load -i image.tar
          docker tag "ml-app:${GITHUB_SHA}" "$IMAGE_NAME:sha-${GITHUB_SHA}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE_NAME:sha-${GITHUB_SHA}"
          IMAGE_WITH_TAG="$IMAGE_NAME:sha-${GITHUB_SHA}"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_WITH_TAG")"
          if [ -z "$DIGEST" ]; then
             DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_WITH_TAG" 2>/dev/null || true)
          fi

          if [[ -z "$DIGEST" || "$DIGEST" != *"@sha256:"* ]]; then
            echo "::error::Could not obtain immutable image digest for $IMAGE_WITH_TAG"
            exit 1
          fi
          
          echo "image_ref=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Published immutable image: $DIGEST"
          echo "Source commit: $GITHUB_SHA"

  deploy-test:
    name: CD / deploy to test environment
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: test
    steps:
      - name: Validate deployment configuration
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          for name in STAGING_HOST STAGING_USER STAGING_SSH_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done
          echo "SSH configuration is present"
      - name: Test SSH connection
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: 22
          script: |
            whoami
            hostname
            docker --version
      - name: Deploy exact published digest over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_REF: ${{ needs.publish.outputs.image_ref }}
          MODEL_VERSION: sha-${{ github.sha }}
          GHCR_USER: ${{ secrets.STAGING_GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.STAGING_GHCR_TOKEN }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          envs: IMAGE_REF,MODEL_VERSION,GHCR_USER,GHCR_TOKEN
          script: |
            set -eu
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE_REF"
            docker rm -f ml-api-staging >/dev/null 2>&1 || true
            docker run -d --name ml-api-staging --restart unless-stopped \
              -p 8000:8000 -e MODEL_VERSION="$MODEL_VERSION" "$IMAGE_REF"
            echo "Deployed: $IMAGE_REF"

  smoke-test:
    name: CD / staging smoke tests
    runs-on: ubuntu-latest
    needs: deploy-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Run smoke tests
        run: python scripts/smoke_test.py http://127.0.0.1:8000